services:
  support:
    build: .
    command: uvicorn support.app:app --host 0.0.0.0 --port 8001
    env_file: .env
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - ./data:/app/data
  automations:
    build: .
    command: uvicorn automations.app:app --host 0.0.0.0 --port 8002
    env_file: .env
    ports:
      - "127.0.0.1:8002:8002"
    volumes:
      - ./data:/app/data
  documents:
    build: .
    command: uvicorn documents.app:app --host 0.0.0.0 --port 8003
    env_file: .env
    ports:
      - "127.0.0.1:8003:8003"
    volumes:
      - ./data:/app/data
